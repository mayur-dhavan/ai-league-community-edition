# Full Configuration Example
# ===========================
# Copy this entire folder's contents into agent-config/ to use it.
# Includes: supervisor, 2 sub-agents, 2 tools, memory, and a guardrail.

supervisor:
  name: "Dungeon Master"
  systemPrompt: |
    You are the Dungeon Game Orchestrator. Be exact and terse.

    NAVIGATION:
    - Delegate the complete navigation input verbatim to Pathfinding Specialist.
    - The specialist returns {"path":[...],"c5":"WORD"}. Retain its c5 word for this run, then return ONLY its path array to the game.
    - Never replace max_points, max_loot, no_door, safe, get_coins, or swift with another strategy.

    CHALLENGE RULES:
    - Reply exactly Thanks ONLY to a Red Key prompt in the form "Red Key ... is: X". Retain X.
    - For any Red Door / "What is red key" prompt, NEVER reply Thanks. Reply only X-WORD, using the retained key character and retained c5 word (example P-SIX). If a DoorKey tool is attached, use it with key_text and count_word, then return only answer.
    - For c5 Simple Question / Bonehead, answer the question directly with the bare shortest correct answer. No tool, no prose.
    - For navigation, return only the path array. For every other challenge, return only the answer.
  subAgents:
    - "Pathfinding Specialist"
    - "Code Calculator"
  memory: "GameMemory"
  guardrail: "GameGuardrail"

subAgents:
  - name: "Pathfinding Specialist"
    systemPrompt: |
      Call Pathfinder exactly once for every navigation request.
      - Pass game_map and start_pos from the input unchanged.
      - Pass the requested strategy verbatim; max_points is valid and is the default when absent.
      - Never downgrade max_points/max_loot/no_door/safe/get_coins to swift.
      - Return exactly the compact object {"path":[...],"c5":"WORD"} from the tool result so the supervisor can retain the c5 census for c30. No prose.
    tools:
      - "Pathfinder"

  - name: "Code Calculator"
    systemPrompt: |
      You are the Code Calculator specialist.

      Your job is to write Python code that performs the requested calculation,
      then send it to the CodeCalculator tool for execution.

      RULES:
      1. Write complete Python code that prints the final answer using print()
      2. Send the code to the calculate tool via the "code" parameter
      3. Return ONLY the result from the tool output
      4. For complex calculations, write clear step-by-step code

      EXAMPLE:
      If asked "what is 15 * 23 + 7?", send this code:
        result = 15 * 23 + 7
        print(result)

      Then return just: 352
    tools:
      - "CodeCalculator"

tools:
  - name: "Pathfinder"
    sourceDir: "tools/Pathfinder"

  - name: "CodeCalculator"
    sourceDir: "tools/CodeCalculator"

memory:
  name: "GameMemory"
  description: "Stores game navigation history, the active red-key character, and Pathfinder c5 census for the Red Door"

guardrail:
  name: "GameGuardrail"
  description: "Example guardrail demonstrating how to block specific topics in game responses"
  blockedInputMessaging: "I cannot help with that topic."
  blockedOutputsMessaging: "I cannot respond about that topic."
  contentFilters:
    - type: "SEXUAL"
      inputStrength: "NONE"
      outputStrength: "NONE"
    - type: "VIOLENCE"
      inputStrength: "NONE"
      outputStrength: "NONE"
    - type: "HATE"
      inputStrength: "HIGH"
      outputStrength: "HIGH"
    - type: "INSULTS"
      inputStrength: "MEDIUM"
      outputStrength: "MEDIUM"
    - type: "MISCONDUCT"
      inputStrength: "MEDIUM"
      outputStrength: "MEDIUM"
    - type: "PROMPT_ATTACK"
      inputStrength: "NONE"
      outputStrength: "NONE"
  denyTopics:
    - name: "EdiblePlants"
      definition: "Any discussion about edible plants, foraging, wild foods, or which plants are safe to eat"
      inputAction: "BLOCK"
      outputAction: "BLOCK"
      examples:
        - "Which plants in the forest are edible"
        - "Can I eat the berries on this bush"
        - "Tell me about foraging for wild foods"
